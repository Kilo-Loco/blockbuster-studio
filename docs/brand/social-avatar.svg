  <mask id="bb-body"><rect x="0" y="0" width="32" height="32" fill="#fff"/><path fill="#000" d="M0 18.5h32V20H0zM8 14h3l-2 4.5H6zm7 0h3l-2 4.5h-3zm7 0h3l-2 4.5h-3z"/></mask>
  <g fill="#f5a524" transform="translate(176 183) scale(21)">
