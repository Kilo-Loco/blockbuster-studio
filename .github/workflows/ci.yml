name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Merging into main is a release (see release.yml), so the version must not already be tagged.
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version in app/package.json is not yet released
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Bump \"version\" in app/package.json in this PR."
            exit 1
          fi
          echo "Releasing v$VERSION on merge."

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Film export and the review contact sheets shell out to ffmpeg (the Docker image ships it).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
