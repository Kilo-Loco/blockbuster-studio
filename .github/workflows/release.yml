name: Release

# Day-to-day work merges into `develop`; merging `develop` into `main` is the release. Every push to
# main tags the commit with the version in app/package.json, publishes a GitHub Release with generated
# notes, and builds + pushes the Docker image under that version (Vercel redeploys the site and docs
# from main on its own). The CI workflow refuses PRs into main whose version is already tagged, so a
# release always needs a version bump.
on:
  push:
    branches: [main]
  # Manual rebuild of the current main commit: pushes the sha + latest tags, creates no release.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blockbuster-studio
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from app/package.json
        id: version
        run: echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Bump \"version\" in app/package.json before merging into main."
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The CUDA base image + ComfyUI + pip installs are large; free up runner disk first
      # (default GitHub-hosted runners have ~14GB free, not enough headroom otherwise).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror: Runpod hosts pull (and cache) Docker Hub images far faster than GHCR; a fresh
      # host took over an hour on GHCR layers on 2026-09-28. Runs only when the two secrets are set.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blockbuster-studio,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version }},enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
